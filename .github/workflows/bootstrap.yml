      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Fetch PRoot
        working-directory: xlinux
        run: |
          sudo apt-get install -y patchelf
          bash scripts/fetch-proot.sh
      - name: Build APK
        working-directory: xlinux
        shell: bash
        run: gradle assembleDebug --no-daemon --console=plain 2>&1 | tee ../build.log
      - name: Show errors in summary
        if: failure()
        run: |
          { echo '### Build errors'; echo '```'; grep -E "^e: |error:|What went wrong|Unresolved|Caused by|FAILED" -A2 build.log | head -80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: XLinux-debug-apk
          path: xlinux/app/build/outputs/apk/debug/*.apk
